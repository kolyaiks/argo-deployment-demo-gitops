apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/kolyaiks/argo-deployment-demo-gitops
    targetRevision: main
    path: platform/external-gateway
#    helm:
#      valueFiles:
#        - values.yaml

  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true