apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: platform
  annotations:
    #alb.ingress.kubernetes.io/certificate-arn: {{ .Values.gateway.certificateArn | quote }}
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      kind: LoadBalancerConfiguration
      name: internet-facing-config
      group: gateway.k8s.aws
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
          namespaces:
            from: All
